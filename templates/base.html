<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}VentasRF{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="{% block body_class %}{% endblock %}">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="brand-icon">🫕</span>
      <span class="brand-text">VentasRF</span>
    </div>
    <div class="navbar-links">
      <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
        Dashboard
      </a>
      <a href="/agenda" class="nav-link {% if request.path == '/agenda' %}active{% endif %}">
        Agenda
      </a>
      <a href="/reparto" class="nav-link {% if request.path == '/reparto' %}active{% endif %}">
        Reparto
      </a>
      <a href="/productos" class="nav-link {% if request.path == '/productos' %}active{% endif %}">
        Productos
      </a>
      <a href="/nuevo-pedido" class="nav-link btn-primary {% if request.path == '/nuevo-pedido' %}active{% endif %}">
        + Nuevo Pedido
      </a>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer con precios -->
  <footer class="footer">
    <span id="footer-precios">Cargando precios…</span>
  </footer>

  <script>
    // Carga los precios en el footer
    fetch('/api/productos?activos=true').then(r => r.json()).then(productos => {
      document.getElementById('footer-precios').textContent = 
        productos.map(p => `${p.nombre}: $${p.precio.toLocaleString('es-AR')}`).join(' | ');
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
