version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ventasrf_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-usuario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-ventasrf}
      PGTIMEZONE: 'America/Argentina/Buenos_Aires'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-usuario} -d $${POSTGRES_DB:-ventasrf}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: ventasrf_web
    restart: always
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-usuario}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-ventasrf}
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: ventasrf_frontend
    restart: always
    ports:
      - "80:80" # Expone la app móvil web en el puerto 80 del VPS
    volumes:
      - ./mobile/dist:/usr/share/nginx/html

volumes:
  postgres_data:
